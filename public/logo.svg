<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&amp;display=swap');
      
      .text-white { fill: #FFFFFF; font-family: 'Montserrat', 'Arial Black', 'Impact', sans-serif; font-weight: 900; font-size: 110px; letter-spacing: 2px; }
      .text-small { fill: #FFFFFF; font-family: 'Montserrat', 'Arial Black', 'Impact', sans-serif; font-weight: 800; font-size: 28px; letter-spacing: 5px; }
      .accent { fill: #B1FA41; }
    </style>
  </defs>

  <!-- TRAD -->
  <text x="20" y="120" class="text-white">TRAD</text>

  <!-- Custom E -->
  <g transform="translate(370, 32)">
    <rect x="0" y="0" width="65" height="88" rx="6" class="accent" />
    <rect x="25" y="18" width="45" height="15" fill="#000000" />
    <rect x="25" y="52" width="45" height="15" fill="#000000" />
  </g>

  <!-- NEX -->
  <text x="450" y="120" class="text-white">NE</text>

  <!-- Custom X -->
  <g transform="translate(620, 32)">
    <!-- White Backslash \ -->
    <polygon points="0,0 22,0 72,88 50,88" fill="#FFFFFF" />
    <!-- Green Forward Slashes // -->
    <polygon points="45,-5 60,-5 15,93 0,93" fill="#B1FA41" />
    <polygon points="65,-5 80,-5 35,93 20,93" fill="#B1FA41" />
  </g>

  <!-- A -->
  <text x="705" y="120" class="text-white">A</text>

  <!-- POWERED BY NADO -->
  <text x="180" y="180" class="text-small">POWERED BY NADO</text>
</svg>
